deploy-source:
  stage: deploy
  image: python:3.12
  tags:
    - linux-docker
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_TAG =~ /^v/'
    - when: never
  script:
    - python -m pip install --upgrade build
    - python -m build --sdist
    - python -m pip install twine
    - python -m twine upload --non-interactive dist/*
  artifacts:
    paths:
      - dist/*
