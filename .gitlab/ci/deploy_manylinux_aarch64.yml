deploy-manylinux-aarch64:
  extends: .gitlab-unix-python
  stage: deploy
  tags:
    - ubuntu-24.04-arm
    - docker
  variables:
    PYTHON_VERSION: "3.12"
    CIBW_ARCHS_LINUX: aarch64
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_TAG =~ /^v/'
    - if: '$CI_PIPELINE_SOURCE == "web" && $CI_WORKFLOW == "deploy_manylinux_aarch64"'
    - when: never
  script:
    - docker info
    - python -m pip install "cibuildwheel==3.3.0" packaging twine
    - python -m cibuildwheel --platform linux --output-dir wheelhouse
    - ls -l wheelhouse
    - python -m twine upload --non-interactive --skip-existing wheelhouse/*.whl
  artifacts:
    paths:
      - wheelhouse/*.whl
