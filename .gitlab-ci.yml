include:
  - local: /.gitlab/ci/build-multi-platform.yml
  - local: /.gitlab/ci/deploy_manylinux_aarch64.yml
  - local: /.gitlab/ci/deploy_manylinux_x86_64.yml
  - local: /.gitlab/ci/deploy_source.yml
  - local: /.gitlab/ci/deploy_win_macos.yml

stages:
  - build
  - deploy

variables:
  GIT_SUBMODULE_STRATEGY: recursive
  GIT_SUBMODULE_FORCE_HTTPS: "true"
  CIBW_BUILD: "cp310-* cp311-* cp312-* cp313-* cp314-*"
  CI_WORKFLOW:
    value: ""
    options:
      - ""
      - deploy_manylinux_aarch64
      - deploy_manylinux_x86_64
      - deploy_win_macos
    description: "Select a wheel workflow when running a pipeline manually."

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "develop"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_TAG =~ /^v/'
    - if: '$CI_PIPELINE_SOURCE == "web" && $CI_WORKFLOW =~ /^(deploy_manylinux_aarch64|deploy_manylinux_x86_64|deploy_win_macos)$/'
    - when: never

.gitlab-unix-python:
  before_script:
    - export PYENV_VERSION="$PYTHON_VERSION"
    - export PATH="$(pyenv root)/shims:$PATH"
    - python -c "import os, sys; assert '.'.join(map(str, sys.version_info[:2])) == os.environ['PYTHON_VERSION'], sys.version"
    - python -m venv .venv
    - . .venv/bin/activate

.gitlab-windows-python:
  before_script:
    - |
      $ErrorActionPreference = "Stop"
      $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
      $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
      if ($LASTEXITCODE -ne 0 -or -not $vsPath) { throw "Visual Studio C++ build tools were not found" }
      Import-Module "$vsPath\Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
      Enter-VsDevShell -VsInstallPath $vsPath -SkipAutomaticLocation -DevCmdArguments "-arch=x64 -host_arch=x64"
      & py "-$env:PYTHON_VERSION" -m venv .venv
      if ($LASTEXITCODE -ne 0) { throw "Failed to create the Python virtual environment" }
      . .\.venv\Scripts\Activate.ps1
      python -c "import os, sys; assert '.'.join(map(str, sys.version_info[:2])) == os.environ['PYTHON_VERSION'], sys.version"
      if ($LASTEXITCODE -ne 0) { throw "Unexpected Python version" }
